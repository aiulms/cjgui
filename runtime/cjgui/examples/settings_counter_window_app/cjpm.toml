[package]
  cjc-version = "1.1.3"
  name = "cjgui_settings_counter_window_app"
  version = "0.0.0"
  output-type = "executable"
  src-dir = "src"

[dependencies]
  cjgui = { path = "../../" }
  cjgui_shared_operation_core = { path = "../../shared_operation_core" }
  cjgui_settings_counter_application = { path = "../settings_counter_application" }

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff all"
    release = "--fast-math -O2 -s -Woff all"
  [profile.test]
