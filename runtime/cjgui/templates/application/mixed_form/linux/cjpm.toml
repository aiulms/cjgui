[package]
cjc-version = "1.1.3"
name = "cjgui_linux_mixed_form_app"
version = "0.0.0"
output-type = "executable"
src-dir = "src"

[dependencies]
cjgui = { path = "__CJGUI_FRAMEWORK_RELATIVE_PATH__" }
cjgui_shared_operation_core = { path = "__CJGUI_FRAMEWORK_RELATIVE_PATH__/shared_operation_core" }
cjgui_notification_threshold_application = { path = "__CJGUI_FRAMEWORK_RELATIVE_PATH__/examples/notification_threshold_application" }

[ffi.c]
cjgui_internal_renderer = { path = "./.cjgui/native/lib" }
