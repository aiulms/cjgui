[package]
  cjc-version = "1.1.3"
  name = "cjgui_settings_counter_application"
  version = "0.0.0"
  output-type = "static"
  src-dir = "src"

[dependencies]
  cjgui = { path = "../../" }
  cjgui_shared_operation_core = { path = "../../shared_operation_core" }

[profile]
  [profile.build]
    incremental = true
    lto = ""
  [profile.customized-option]
    debug = "-g -Woff all"
    release = "--fast-math -O2 -s -Woff all"
  [profile.test]
