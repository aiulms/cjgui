<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
    <title id="title">CJGUI 技术架构</title>
    <desc id="desc">CJGUI 的 AI 原生 GUI runtime、Action Gateway、仓颉 runtime、Renderer、AppKit Metal 桥接和自动化验证架构图。</desc>
    <defs>
        <style>
            text {
                font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
                fill: #1f2937;
            }
            .title {
                font-size: 42px;
                font-weight: 700;
            }
            .layer-label {
                font-size: 28px;
                font-weight: 600;
            }
            .box-title {
                font-size: 26px;
                font-weight: 700;
            }
            .box-text {
                font-size: 22px;
                font-weight: 500;
            }
            .small {
                font-size: 18px;
                font-weight: 500;
            }
            .tiny {
                font-size: 15px;
                font-weight: 500;
            }
            .solid {
                fill: #ffffff;
                stroke: #27313f;
                stroke-width: 2.5;
            }
            .soft {
                fill: #f9fafb;
                stroke: #27313f;
                stroke-width: 2;
            }
            .future {
                fill: #ffffff;
                stroke: #27313f;
                stroke-width: 2.4;
                stroke-dasharray: 13 9;
            }
            .accent {
                fill: #eef6ff;
                stroke: #2563eb;
                stroke-width: 2.4;
            }
            .safe {
                fill: #f0fdf4;
                stroke: #16a34a;
                stroke-width: 2.2;
            }
            .line {
                stroke: #27313f;
                stroke-width: 2.4;
            }
            .dash-line {
                stroke: #27313f;
                stroke-width: 2.4;
                stroke-dasharray: 16 10;
            }
            .arrow {
                fill: none;
                stroke: #6b7280;
                stroke-width: 7;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
        </style>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
        </marker>
    </defs>

    <rect x="0" y="0" width="1400" height="860" fill="#ffffff"/>
    <text x="36" y="56" class="title">CJGUI 技术架构</text>
    <text x="36" y="92" class="small">实线：当前 P1 runtime / renderer runway；虚线：未来 AI-native 表达层与工具链</text>

    <!-- 左侧层级标签 -->
    <text x="74" y="186" class="layer-label">AI 协作层</text>
    <text x="92" y="312" class="layer-label">表达层</text>
    <text x="76" y="474" class="layer-label">运行时层</text>
    <text x="46" y="640" class="layer-label">渲染桥接层</text>
    <text x="92" y="792" class="layer-label">平台层</text>

    <line x1="38" y1="248" x2="1182" y2="248" class="dash-line"/>
    <line x1="38" y1="398" x2="1182" y2="398" class="dash-line"/>
    <line x1="38" y1="582" x2="1182" y2="582" class="dash-line"/>
    <line x1="38" y1="730" x2="1182" y2="730" class="dash-line"/>

    <!-- 主架构边框 -->
    <rect x="255" y="138" width="900" height="600" rx="18" class="solid"/>

    <!-- AI / application top -->
    <rect x="300" y="118" width="810" height="78" rx="28" class="accent"/>
    <text x="705" y="153" text-anchor="middle" class="box-title">AI 原生应用 / 仓颉业务模块</text>
    <text x="705" y="181" text-anchor="middle" class="small">人类意图、业务状态、可审计 Action 请求</text>

    <!-- future semantic surface -->
    <rect x="255" y="196" width="900" height="74" class="future"/>
    <text x="705" y="226" text-anchor="middle" class="box-title">未来表达层：Semantic UI Spec / Generated UI</text>
    <text x="705" y="254" text-anchor="middle" class="small">preview / diff / reject / explain，不直接拥有 UI truth</text>

    <!-- Action Gateway -->
    <rect x="255" y="270" width="900" height="72" class="accent"/>
    <text x="705" y="302" text-anchor="middle" class="box-title">Owner-controlled Action Gateway</text>
    <text x="705" y="330" text-anchor="middle" class="small">schema validation / scope / generation / evidence / owner acceptance</text>

    <!-- Runtime layer boxes -->
    <rect x="255" y="342" width="180" height="82" class="soft"/>
    <text x="345" y="378" text-anchor="middle" class="box-text">App</text>
    <text x="345" y="407" text-anchor="middle" class="box-text">Lifecycle</text>

    <rect x="435" y="342" width="190" height="82" class="soft"/>
    <text x="530" y="378" text-anchor="middle" class="box-text">Window</text>
    <text x="530" y="407" text-anchor="middle" class="box-text">Lifecycle</text>

    <rect x="625" y="342" width="190" height="82" class="soft"/>
    <text x="720" y="378" text-anchor="middle" class="box-text">Runtime</text>
    <text x="720" y="407" text-anchor="middle" class="box-text">State</text>

    <rect x="815" y="342" width="170" height="82" class="soft"/>
    <text x="900" y="378" text-anchor="middle" class="box-text">Action</text>
    <text x="900" y="407" text-anchor="middle" class="box-text">Router</text>

    <rect x="985" y="342" width="170" height="82" class="soft"/>
    <text x="1070" y="378" text-anchor="middle" class="box-text">Queue</text>
    <text x="1070" y="407" text-anchor="middle" class="box-text">Boundary</text>

    <!-- Renderer admission -->
    <rect x="255" y="424" width="300" height="92" class="safe"/>
    <text x="405" y="460" text-anchor="middle" class="box-title">Renderer Admission</text>
    <text x="405" y="489" text-anchor="middle" class="small">owner truth / stop-line</text>

    <rect x="555" y="424" width="300" height="92" class="safe"/>
    <text x="705" y="460" text-anchor="middle" class="box-title">Result Envelope</text>
    <text x="705" y="489" text-anchor="middle" class="small">bounded probe / failure classification</text>

    <rect x="855" y="424" width="300" height="92" class="safe"/>
    <text x="1005" y="460" text-anchor="middle" class="box-title">Scene / RenderCommand</text>
    <text x="1005" y="489" text-anchor="middle" class="small">future semantic render input</text>

    <!-- Native bridge / renderer pipeline -->
    <rect x="255" y="516" width="180" height="86" class="solid"/>
    <text x="345" y="550" text-anchor="middle" class="box-text">极窄</text>
    <text x="345" y="579" text-anchor="middle" class="box-text">C ABI</text>

    <rect x="435" y="516" width="180" height="86" class="solid"/>
    <text x="525" y="550" text-anchor="middle" class="box-text">Token</text>
    <text x="525" y="579" text-anchor="middle" class="box-text">Table</text>

    <rect x="615" y="516" width="190" height="86" class="solid"/>
    <text x="710" y="550" text-anchor="middle" class="box-text">AppKit</text>
    <text x="710" y="579" text-anchor="middle" class="box-text">NSWindow/NSView</text>

    <rect x="805" y="516" width="180" height="86" class="solid"/>
    <text x="895" y="550" text-anchor="middle" class="box-text">CAMetalLayer</text>
    <text x="895" y="579" text-anchor="middle" class="box-text">Drawable</text>

    <rect x="985" y="516" width="170" height="86" class="solid"/>
    <text x="1070" y="550" text-anchor="middle" class="box-text">Metal</text>
    <text x="1070" y="579" text-anchor="middle" class="box-text">Device</text>

    <rect x="255" y="602" width="160" height="82" class="solid"/>
    <text x="335" y="637" text-anchor="middle" class="box-text">Command</text>
    <text x="335" y="666" text-anchor="middle" class="box-text">Queue</text>

    <rect x="415" y="602" width="170" height="82" class="solid"/>
    <text x="500" y="637" text-anchor="middle" class="box-text">Command</text>
    <text x="500" y="666" text-anchor="middle" class="box-text">Buffer</text>

    <rect x="585" y="602" width="170" height="82" class="solid"/>
    <text x="670" y="637" text-anchor="middle" class="box-text">Render Pass</text>
    <text x="670" y="666" text-anchor="middle" class="box-text">Descriptor</text>

    <rect x="755" y="602" width="150" height="82" class="solid"/>
    <text x="830" y="637" text-anchor="middle" class="box-text">Encoder</text>
    <text x="830" y="666" text-anchor="middle" class="small">bounded</text>

    <rect x="905" y="602" width="130" height="82" class="solid"/>
    <text x="970" y="637" text-anchor="middle" class="box-text">Pipeline</text>
    <text x="970" y="666" text-anchor="middle" class="small">state</text>

    <rect x="1035" y="602" width="120" height="82" class="solid"/>
    <text x="1095" y="637" text-anchor="middle" class="box-text">Draw</text>
    <text x="1095" y="666" text-anchor="middle" class="small">first slice</text>

    <!-- Platform layer -->
    <rect x="255" y="684" width="430" height="96" class="accent"/>
    <text x="470" y="722" text-anchor="middle" class="box-title">macOS first</text>
    <text x="470" y="752" text-anchor="middle" class="small">AppKit + Metal</text>

    <rect x="685" y="684" width="470" height="96" class="future"/>
    <text x="920" y="722" text-anchor="middle" class="box-title">未来平台层</text>
    <text x="920" y="752" text-anchor="middle" class="small">鸿蒙 / Linux / Windows / 其他后端按证据接入</text>

    <!-- 右侧 AI / tooling sidecar -->
    <path d="M1230 146 Q1205 146 1205 174 L1205 770 Q1205 798 1230 798 L1355 798 Q1380 798 1380 770 L1380 174 Q1380 146 1355 146 Z" class="future"/>
    <text x="1292" y="210" text-anchor="middle" class="box-title">AI 协作</text>
    <text x="1292" y="246" text-anchor="middle" class="small">Codex 自动化</text>
    <text x="1292" y="276" text-anchor="middle" class="small">Agent / IDE</text>

    <line x1="1220" y1="318" x2="1365" y2="318" class="dash-line"/>
    <text x="1292" y="372" text-anchor="middle" class="box-title">代码智能</text>
    <text x="1292" y="410" text-anchor="middle" class="small">GitNexus</text>
    <text x="1292" y="440" text-anchor="middle" class="small">CodeLattice</text>

    <line x1="1220" y1="482" x2="1365" y2="482" class="dash-line"/>
    <text x="1292" y="538" text-anchor="middle" class="box-title">验证链路</text>
    <text x="1292" y="576" text-anchor="middle" class="small">Probe / Smoke</text>
    <text x="1292" y="606" text-anchor="middle" class="small">Build / Scan</text>
    <text x="1292" y="636" text-anchor="middle" class="small">Stage Report</text>

    <path d="M1188 318 L1162 346 L1188 374" class="arrow"/>
    <path d="M1188 548 L1162 576 L1188 604" class="arrow"/>

    <!-- Current position marker -->
    <rect x="985" y="696" width="146" height="36" rx="18" fill="#1f2937"/>
    <text x="1058" y="720" text-anchor="middle" class="tiny" fill="#ffffff">当前：first-frame runway</text>
</svg>
