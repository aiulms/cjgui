<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" role="img" aria-labelledby="title desc">
    <title id="title">CJGUI 技术架构</title>
    <desc id="desc">CJGUI 将传统 UI 开发通道、AI 语义建议通道、Owner 受控入口、仓颉 runtime 和 AppKit Metal 渲染底座分层展示。</desc>
    <defs>
        <style>
            text {
                font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif;
                fill: #1f2937;
            }
            .title { font-size: 42px; font-weight: 700; }
            .subtitle { font-size: 19px; font-weight: 500; fill: #4b5563; }
            .section { font-size: 26px; font-weight: 700; }
            .h1 { font-size: 26px; font-weight: 700; }
            .h2 { font-size: 21px; font-weight: 700; }
            .body { font-size: 17px; font-weight: 500; }
            .small { font-size: 14px; font-weight: 500; }
            .note { font-size: 15px; font-weight: 500; fill: #6b7280; }
            .solid { fill: #ffffff; stroke: #243041; stroke-width: 2.3; }
            .blue { fill: #eef6ff; stroke: #2563eb; stroke-width: 2.5; }
            .green { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.4; }
            .orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.4; }
            .gray { fill: #f9fafb; stroke: #243041; stroke-width: 2.1; }
            .future { fill: #ffffff; stroke: #243041; stroke-width: 2.3; stroke-dasharray: 12 8; }
            .dash { stroke: #243041; stroke-width: 2.2; stroke-dasharray: 14 10; }
            .arrow { fill: none; stroke: #6b7280; stroke-width: 3.4; marker-end: url(#arrow); }
            .blocked { fill: none; stroke: #dc2626; stroke-width: 3; stroke-dasharray: 10 7; }
        </style>
        <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/>
        </marker>
    </defs>

    <rect width="1400" height="840" fill="#ffffff"/>
    <text x="42" y="56" class="title">CJGUI 技术架构</text>
    <text x="42" y="88" class="subtitle">AI 是一等协作者，但不能越权；传统 UI runtime 和原生渲染管线仍然是底座。</text>

    <!-- 顶部两条入口 -->
    <rect x="110" y="126" width="520" height="118" rx="18" class="blue"/>
    <text x="370" y="164" text-anchor="middle" class="h1">传统开发通道</text>
    <text x="370" y="195" text-anchor="middle" class="body">仓颉业务代码 / 组件 API / 应用状态</text>
    <text x="370" y="222" text-anchor="middle" class="small">普通开发者不需要理解 Metal / C ABI</text>

    <rect x="770" y="126" width="520" height="118" rx="18" class="future"/>
    <text x="1030" y="164" text-anchor="middle" class="h1">AI 语义建议通道</text>
    <text x="1030" y="195" text-anchor="middle" class="body">Semantic Proposal / Generated UI / Workflow Suggestion</text>
    <text x="1030" y="222" text-anchor="middle" class="small">AI 提建议，不直接改 UI truth，不直接操作 GPU</text>

    <!-- AI cannot bypass -->
    <path d="M1030 244 C1030 278 960 286 902 292" class="arrow"/>
    <path d="M1068 250 C1148 332 1148 520 1036 592" class="blocked"/>
    <text x="1154" y="418" class="small" fill="#dc2626">禁止直连 Renderer / Metal</text>

    <path d="M370 244 C370 276 444 286 502 292" class="arrow"/>

    <!-- Owner acceptance gate -->
    <rect x="330" y="292" width="740" height="96" rx="18" class="orange"/>
    <text x="700" y="329" text-anchor="middle" class="h1">Owner-controlled Action Gateway</text>
    <text x="700" y="357" text-anchor="middle" class="body">Preview / Diff / Reject / Explain / Accept</text>
    <text x="700" y="381" text-anchor="middle" class="small">只有被 owner 接受的变更，才进入 UI runtime</text>

    <path d="M700 388 L700 436" class="arrow"/>

    <!-- Runtime -->
    <rect x="155" y="436" width="1090" height="112" rx="16" class="green"/>
    <text x="700" y="472" text-anchor="middle" class="h1">仓颉 UI Runtime</text>
    <text x="700" y="501" text-anchor="middle" class="body">App Lifecycle / Window Lifecycle / Runtime State / Action Router / Queue Boundary</text>
    <text x="700" y="527" text-anchor="middle" class="small">传统 UI 和 AI 接受后的变更，统一进入这条 runtime 管线</text>

    <path d="M700 548 L700 596" class="arrow"/>

    <!-- Renderer input -->
    <rect x="155" y="596" width="1090" height="96" rx="16" class="gray"/>
    <text x="700" y="632" text-anchor="middle" class="h1">Renderer 输入层</text>
    <text x="700" y="661" text-anchor="middle" class="body">Scene / RenderCommand / Layout Result / Result Envelope</text>
    <text x="700" y="684" text-anchor="middle" class="small">这里是框架内部可验证表示，不是 AI 直接生成的 GPU 指令</text>

    <path d="M700 692 L700 724" class="arrow"/>

    <!-- Native renderer base -->
    <rect x="155" y="724" width="1090" height="76" rx="16" class="solid"/>
    <text x="700" y="755" text-anchor="middle" class="h1">原生渲染底座：极窄 C ABI + Token Table + AppKit / CAMetalLayer / Metal</text>
    <text x="700" y="783" text-anchor="middle" class="body">NSWindow / NSView / Drawable / Command Queue / Command Buffer / Render Pass / Encoder / Pipeline / Draw / Commit</text>

    <!-- Side notes -->
    <rect x="80" y="292" width="205" height="96" rx="14" class="blue"/>
    <text x="182" y="326" text-anchor="middle" class="h2">开发者视角</text>
    <text x="182" y="356" text-anchor="middle" class="small">写仓颉 UI / 状态</text>
    <text x="182" y="378" text-anchor="middle" class="small">不碰底层图形管线</text>

    <rect x="1115" y="292" width="205" height="96" rx="14" class="future"/>
    <text x="1218" y="326" text-anchor="middle" class="h2">AI 视角</text>
    <text x="1218" y="356" text-anchor="middle" class="small">生成 proposal</text>
    <text x="1218" y="378" text-anchor="middle" class="small">等待 owner 接受</text>

    <rect x="80" y="596" width="205" height="96" rx="14" class="future"/>
    <text x="182" y="630" text-anchor="middle" class="h2">未来方向</text>
    <text x="182" y="660" text-anchor="middle" class="small">语义树 / 可解释 UI</text>
    <text x="182" y="682" text-anchor="middle" class="small">AI-native WYSIWYG</text>

    <rect x="1115" y="596" width="205" height="96" rx="14" class="future"/>
    <text x="1218" y="630" text-anchor="middle" class="h2">工程保障</text>
    <text x="1218" y="660" text-anchor="middle" class="small">GitNexus / Probe</text>
    <text x="1218" y="682" text-anchor="middle" class="small">只是研发工具</text>

    <text x="155" y="824" class="note">关键边界：AI 不直接写 Metal / Render Pass / C ABI；底层复杂性由 CJGUI 框架封装，普通开发者和 AI 面向高层语义与受控动作入口。</text>
</svg>
