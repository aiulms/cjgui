[package]
cjc-version = "1.1.3"
name = "cjgui_collaboration_starter"
version = "0.0.0"
output-type = "executable"
src-dir = "src"
link-option = "-framework AppKit -framework Metal -framework MetalKit -framework QuartzCore -lobjc -headerpad_max_install_names"

[dependencies]
cjgui = { path = "__CJGUI_FRAMEWORK_RELATIVE_PATH__" }
cjgui_shared_operation_core = { path = "__CJGUI_FRAMEWORK_RELATIVE_PATH__/shared_operation_core" }

[ffi.c]
cjgui_internal_renderer = { path = "./.cjgui/native/lib" }
cjgui_macos_application_launcher = { path = "./.cjgui/native/lib" }
